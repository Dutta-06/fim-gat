[pytest]
testpaths = tests
# Default run = smoke + v2 spec. Stress is opt-in:
#   pytest -m stress                    (heavy: Pokec/full-Pokec scale, all budgets, edge cases)
#   pytest -m "smoke or spec or stress" (everything)
addopts = -m "not stress" -ra -p no:cacheprovider
markers =
    smoke: fast checks of the v1 foundation that v2 reuses (seconds, CPU/GPU)
    stress: heavy or adversarial checks (minutes; large graphs, budgets up to 200, degenerate graphs)
    spec: v2 contract tests; skipped until the corresponding fimgat.v2 module is implemented
    data: dataset presence and integrity; skipped when a dataset has not been built yet
    gpu: needs CUDA
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
